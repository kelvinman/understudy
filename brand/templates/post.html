<!doctype html>
<!-- Understudy post templates. Open with ?t=release|example|rule and the fields as query
     parameters, at the size in ?w= and ?h=; scripts/render-posts.cjs renders the samples. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..600&display=swap">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { font-family: var(--font-sans); -webkit-font-smoothing: antialiased; color: var(--text); background: var(--bg); }
  .post { width: var(--w); height: var(--h); padding: 80px; display: flex; flex-direction: column; overflow: hidden; }
  .lockup { height: 40px; color: var(--text); }
  .lockup img { height: 100%; display: block; }
  h1 { font: 500 64px/76px var(--font-sans); letter-spacing: -0.02em; margin-top: 64px; max-width: 900px; }
  .sub { font: 450 32px/44px var(--font-sans); color: var(--text-secondary); margin-top: 24px; max-width: 880px; }
  .shot { margin-top: auto; border: 2px solid var(--border); border-radius: 24px; overflow: hidden; background: var(--bg); }
  .shot img { display: block; width: 100%; }
  .url { font: 450 28px/1 var(--font-sans); color: var(--text-secondary); margin-top: 40px; }
  /* Example: the page is the post. */
  .example { background: var(--bg-muted); }
  .example .shot { margin-top: 56px; flex: 1; }
  .example .shot img { height: 100%; object-fit: cover; object-position: top left; }
  .example .cap { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 40px; font: 500 34px/44px var(--font-sans); }
  .example .cap span:last-child { font-weight: 450; color: var(--text-secondary); font-size: 28px; }
  /* Rule: one line from the README, big. */
  .num { font: 450 40px/1 var(--font-mono); color: var(--text-secondary); margin-top: auto; }
  .rule h1 { font-size: 88px; line-height: 100px; margin-top: 24px; }
  .rule .sub { margin-bottom: auto; }
  .landscape h1 { font-size: 56px; line-height: 66px; }
  .landscape.release { display: grid; grid-template-columns: 1fr 1.25fr; grid-template-rows: auto 1fr auto; column-gap: 64px; }
  .landscape.release .lockup { grid-column: 1; }
  .landscape.release .text { grid-column: 1; grid-row: 2; }
  .landscape.release .url { grid-column: 1; grid-row: 3; }
  .landscape.release .shot { grid-column: 2; grid-row: 1 / 4; margin: 0 -80px -80px 0; border-radius: 24px 0 0 0; border-right: 0; border-bottom: 0; }
  .landscape.release .shot img { height: 100%; object-fit: cover; object-position: top left; }
</style>
</head>
<body>
<div id="post"></div>
<script>
  var q = new URLSearchParams(location.search), t = q.get("t") || "release";
  var w = +q.get("w") || 1080, h = +q.get("h") || 1350, dark = q.get("theme") === "dark";
  if (dark) document.documentElement.dataset.theme = "dark";
  var lock = '<div class="lockup"><img src="../lockup' + (dark ? "-dark" : "-light") + '.svg" alt="Understudy"></div>';
  var shot = '<div class="shot"><img src="' + (q.get("img") || "../../docs/preview-" + (dark ? "dark" : "light") + ".png") + '" alt=""></div>';
  var html = {
    release: lock + '<div class="text"><h1>' + q.get("title") + '</h1><p class="sub">' + (q.get("sub") || "") + '</p></div>' + shot + '<div class="url">understudyui.com</div>',
    example: lock + shot + '<div class="cap"><span>' + q.get("title") + '</span><span>understudyui.com</span></div>',
    rule: lock + '<div class="num">' + q.get("num") + '</div><h1>' + q.get("title") + '</h1><p class="sub">' + (q.get("sub") || "") + '</p><div class="url">understudyui.com</div>'
  }[t];
  var el = document.getElementById("post");
  el.className = "post " + t + (w > h ? " landscape" : "");
  el.style.setProperty("--w", w + "px"); el.style.setProperty("--h", h + "px");
  el.innerHTML = html;
</script>
</body>
</html>
