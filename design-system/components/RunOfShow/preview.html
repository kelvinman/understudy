<!doctype html>
<html>
<head><meta charset="utf-8"><title>Run of show</title></head>
<body>
<div style="padding:16px;max-width:900px">
  <nav class="us-timeline" aria-label="Beats">
    <a href="#a" style="--us-span:60" title="Welcome">Welcome</a>
    <a href="#a" style="--us-span:180" title="Plan a week">Plan</a>
    <a href="#a" style="--us-span:120" title="Shopping list" aria-current="true">List</a>
    <a href="#a" style="--us-span:120" title="Questions">Questions</a>
  </nav>
    <section class="us-beat" id="a">
    <div class="us-beat-head"><span class="us-beat-time">1:00 to 4:00</span><h2 class="us-beat-title">Share the week</h2><span class="us-tag">Live</span></div>
    <div class="us-screen">
      <div class="us-screen-bar"><span class="us-screen-dots"><span></span><span></span><span></span></span><span class="us-screen-title">Terminal</span></div>
      <div class="us-screen-term"><span class="us-term-cmd">$ pantry share --week</span>
<span class="us-term-dim">  Reading this week's plan</span>
<span class="us-term-ok">  Shared with 3 people:</span> <span class="us-term-link">pantry.app/h/okafor</span>
<span class="us-term-cmd">$ </span><span class="us-term-caret"></span></div>
    </div>
    <div class="us-beat-notes">
      <div><div class="us-beat-label">Do</div><p>Run it live so they see it is one line.</p></div>
      <div><div class="us-beat-label">Say</div><p class="us-beat-say">Whoever is at the shop sees the same list.</p></div>
    </div>
  </section>
</div>
</body>
</html>
