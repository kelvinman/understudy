<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button</title></head>
<body>
<div style="display:flex;flex-direction:column;gap:12px;padding:16px">
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="us-btn">Approve</button><button class="us-btn">Request changes</button><button class="us-btn">No, keep it</button>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="us-btn us-btn-success" aria-pressed="true">Approve</button><button class="us-btn us-btn-danger" aria-pressed="true">Request changes</button><button class="us-btn us-btn-filled">Relaunch to update</button><button class="us-btn us-btn-ghost">Share</button><button class="us-btn us-btn-primary">Publish</button>
  </div>
</div>
<script></script>
</body>
</html>
