<!-- @dsCard group="Workspace" height=260 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>FileList</title></head>
<body>
<div style="display:flex;border:1px solid var(--border-subtle);border-radius:12px;overflow:hidden;max-width:720px">
  <div class="us-files" style="flex:1;min-width:0">
    <div class="us-files-label">Documents</div>
    <a class="us-file" aria-selected="true"><i data-lucide="file-text" aria-hidden="true"></i><span><div class="us-file-name">README.md</div><div class="us-file-meta">Shown in Overview</div></span><span class="us-file-size">9 KB</span></a>
    <div class="us-files-label">Data</div>
    <a class="us-file" aria-selected="false"><i data-lucide="file-json" aria-hidden="true"></i><span><div class="us-file-name">tokens.json</div><div class="us-file-meta">Shown in Colors</div></span><span class="us-file-size">9 KB</span></a>
  </div>
  <aside class="us-detail" style="width:220px"><div class="us-file-name">README.md</div><div class="us-file-meta">Document, 9 KB</div></aside>
</div>
<script>
  var s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js";
  s.onload = function () { window.lucide && lucide.createIcons({ attrs: { "stroke-width": 1.75 } }); };
  document.head.appendChild(s);
</script>
</body>
</html>
