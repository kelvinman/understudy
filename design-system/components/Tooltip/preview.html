<!doctype html>
<html>
<head><meta charset="utf-8"><title>Tooltip</title></head>
<body>
<div style="position:relative;padding:72px 16px 16px;display:flex;gap:12px;align-items:center">
  <span style="color:var(--text-secondary)"><i data-lucide="briefcase"></i></span><span>Ashby</span>
  <div class="us-tip is-on" role="tooltip" style="position:absolute;left:0;top:12px"><span class="us-tip-title">Careers page</span><span class="us-tip-detail">jobs.ashbyhq.com</span></div>
</div>
<script>
  var s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js";
  s.onload = function () { window.lucide && lucide.createIcons({ attrs: { "stroke-width": 1.75 } }); };
  document.head.appendChild(s);
</script>
</body>
</html>
