<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Project desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400&display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>
  /* The filter bar sits on the canvas above the panels and stays put while they scroll. */
  .desk-bar { position: sticky; top: 0; z-index: 4; margin: calc(-1 * var(--space-3)) calc(-1 * var(--space-3)) 0; padding: var(--space-3); background: var(--bg-canvas); }
  .us-panel { padding-bottom: 0; overflow: hidden; }
  .us-panel-head { margin-bottom: var(--space-4); }
  .desk-table { table-layout: fixed; }
  /* Fixed layout takes column widths from the header row. */
  th.stage { width: 128px; }
  th.touched { width: 120px; }
  th.action { width: 152px; }
  .project-name { display: block; }
  .project-status { display: block; margin-top: 2px; font: 400 14px/20px var(--font-sans); color: var(--text-secondary); }
  .project-phone { display: none; }
  td.touched { color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .desk-empty { display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-3); padding-bottom: var(--space-8); }
  .desk-empty p { margin: 0; }
  /* The tasks table: sorted, resized and opened by the reader. On a phone it keeps its columns and scrolls sideways. */
  .work-table .when { color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .work-table .is-unassigned { color: var(--text-secondary); }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (max-width: 760px) {
    .desk-bar { position: static; }
    /* On a phone the table stacks: each row is the project with its button beside it, stage and date under the status. */
    .desk-table :is(.stage, .touched), .desk-table thead { display: none; }
    .desk-table, .desk-table tbody { display: block; }
    .desk-table tr { display: flex; align-items: center; border-top: 1px solid var(--border-subtle); }
    .desk-table td, .desk-table th { border-top: 0; }
    .desk-table td { height: auto; padding-block: var(--space-3); }
    .desk-table td:first-child { flex: 1; min-width: 0; }
    .desk-table td + td { border-left: 0; padding-left: 0; }
    .desk-table .us-table-group th { flex: 1; display: flex; align-items: center; }
    .work-table { min-width: 960px; }
    .project-phone { display: flex; align-items: center; gap: var(--space-2); margin-top: var(--space-1); font: 400 14px/20px var(--font-sans); color: var(--text-secondary); }
    .desk-empty { padding-bottom: var(--space-4); }
  }
</style>
</head>
<body>
<div class="us-workspace">
  <nav class="us-workspace-nav" aria-label="Projects">
    <div class="us-list-label">Desk</div>
    <a class="us-row" href="#" data-view="all"><i data-lucide="layout-grid" aria-hidden="true"></i><span>All projects</span><span class="us-row-count" id="count-all"></span></a>
    <a class="us-row" href="#" data-view="attention"><i data-lucide="circle-dot" aria-hidden="true"></i><span>Needs attention</span><span class="us-row-count" id="count-attention"></span></a>
    <div class="us-list-label">Areas</div>
    <div id="nav-areas"></div>
    <div class="us-tracker" id="week"></div>
  </nav>

  <main class="us-workspace-main">
    <div class="desk-bar">
      <div class="us-filters" role="group" aria-label="Filters">
        <label class="us-search"><i data-lucide="search" aria-hidden="true"></i><input type="search" id="f-search" placeholder="Search projects" aria-label="Search projects"></label>
        <button class="us-btn us-btn-sm" id="f-attention" aria-pressed="false"><i data-lucide="circle-dot" aria-hidden="true"></i><span>Needs attention</span></button>
        <span class="us-select"><select id="f-stage" aria-label="Stage"></select></span>
        <span class="us-select"><select id="f-area" aria-label="Area"></select></span>
        <label class="us-check"><input type="checkbox" id="f-paused" checked><span>Show paused</span></label>
        <div class="us-filters-end"><span class="us-filters-count" id="f-count"></span></div>
      </div>
    </div>
    <div id="panels" style="display:contents"></div>
  </main>
</div>
<div class="visually-hidden" aria-live="polite" id="announce"></div>

<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script>
var DATA = JSON.parse(document.getElementById("data").textContent);
var AREAS = DATA.areas, STAGES = DATA.stages, PROJECTS = DATA.projects;
// Panels split the desk by what each project needs from you. A project sits in the first panel whose test it passes.
var PANELS = [
  { id: "attention", title: "Needs attention", test: function (p) { return p.attention; } },
  { id: "moving", title: "In progress", test: function (p) { return ["Idea", "Building", "Review"].indexOf(p.stage) > -1; } },
  { id: "quiet", title: "Shipped and paused", test: function () { return true; } }
];
var BLANK = { query: "", attention: false, stage: "", area: "", paused: true };
var f = Object.assign({}, BLANK), folded = {};

function icons() { window.lucide?.createIcons({ attrs: { "stroke-width": 1.75 } }); }
function esc(s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
function plural(n, w) { return n + " " + w + (n === 1 ? "" : "s"); }
function shortAge(d) { return d === 0 ? "Today" : d < 7 ? d + "d" : d < 30 ? Math.floor(d / 7) + "w" : d < 365 ? Math.floor(d / 30) + "mo" : Math.floor(d / 365) + "y"; }
function longAge(d) {
  if (d === 0) return "today";
  var n = d < 7 ? d : d < 30 ? Math.floor(d / 7) : d < 365 ? Math.floor(d / 30) : Math.floor(d / 365);
  return plural(n, d < 7 ? "day" : d < 30 ? "week" : d < 365 ? "month" : "year") + " ago";
}
function stageTag(s) { return '<span class="us-tag' + (s === "Shipped" ? " us-tag-success" : s === "Paused" ? " us-tag-outline" : "") + '">' + s + '</span>'; }
function panelOf(p) { return PANELS.find(function (x) { return x.test(p); }).id; }
function shown(p) {
  return (!f.query || (p.name + " " + p.status + " " + p.area).toLowerCase().indexOf(f.query) > -1) &&
    (!f.attention || p.attention) && (!f.stage || p.stage === f.stage) && (!f.area || p.area === f.area) && (f.paused || p.stage !== "Paused");
}

// The prompt that starts a new Claude session on a project: where it stands, what is next, and where the work lives.
function promptFor(p) {
  return "I'm picking up " + p.name + " (" + p.area + ", " + p.stage.toLowerCase() + " stage). " +
    "Where it stands: " + p.status + " I last touched it " + longAge(p.days) + ". " +
    "Next step: " + p.next + " " +
    "The work is in " + p.folder + ". Read it first, tell me what you find, and ask before you change anything.";
}

function renderControls() {
  document.getElementById("f-stage").innerHTML = '<option value="">All stages</option>' + STAGES.map(function (s) { return '<option' + (s === f.stage ? " selected" : "") + '>' + s + '</option>'; }).join("");
  document.getElementById("f-area").innerHTML = '<option value="">All areas</option>' + AREAS.map(function (a) { return '<option' + (a === f.area ? " selected" : "") + '>' + a + '</option>'; }).join("");
  document.getElementById("f-stage").parentElement.classList.toggle("is-set", !!f.stage);
  document.getElementById("f-area").parentElement.classList.toggle("is-set", !!f.area);
  document.getElementById("f-attention").setAttribute("aria-pressed", String(f.attention));
  document.getElementById("f-paused").checked = f.paused;
}

function renderNav() {
  document.getElementById("count-all").textContent = PROJECTS.length;
  document.getElementById("count-attention").textContent = PROJECTS.filter(function (p) { return p.attention; }).length;
  document.querySelector('[data-view="all"]').setAttribute("aria-current", String(!f.area && !f.attention));
  document.querySelector('[data-view="attention"]').setAttribute("aria-current", String(!f.area && f.attention));
  document.getElementById("nav-areas").innerHTML = AREAS.map(function (a) {
    return '<a class="us-row" href="#" data-area="' + a + '" aria-current="' + (f.area === a) + '"><i data-lucide="folder" aria-hidden="true"></i><span>' + a + '</span><span class="us-row-count">' +
      PROJECTS.filter(function (p) { return p.area === a; }).length + '</span></a>';
  }).join("");
  var week = PROJECTS.filter(function (p) { return p.days < 7; }).length;
  document.getElementById("week").innerHTML = '<div class="us-meta">' + week + ' of ' + PROJECTS.length + ' touched this week</div>' +
    '<div class="us-progress" role="progressbar" aria-label="Touched this week" aria-valuenow="' + week + '" aria-valuemax="' + PROJECTS.length + '"><span style="width:' + (week / PROJECTS.length * 100) + '%"></span></div>';
}

function renderPanels() {
  var visible = PROJECTS.filter(shown), html = "";
  document.getElementById("f-count").textContent = visible.length === PROJECTS.length ? plural(PROJECTS.length, "project") : visible.length + " of " + plural(PROJECTS.length, "project");
  PANELS.forEach(function (panel) {
    var rows = visible.filter(function (p) { return panelOf(p) === panel.id; });
    if (!rows.length) return;
    html += '<section class="us-panel" aria-labelledby="h-' + panel.id + '"><div class="us-panel-head"><h2 class="us-display" id="h-' + panel.id + '">' + panel.title + '</h2><span class="us-meta">' + plural(rows.length, "project") + '</span></div>' +
      '<div class="us-table-wrap"><table class="us-table desk-table">' +
      '<thead><tr><th scope="col">Project</th><th scope="col" class="stage">Stage</th><th scope="col" class="touched">Last touched</th><th scope="col" class="action"><span class="visually-hidden">Actions</span></th></tr></thead>';
    AREAS.forEach(function (area) {
      var inArea = rows.filter(function (p) { return p.area === area; }).sort(function (a, b) { return a.days - b.days; });
      if (!inArea.length) return;
      var key = panel.id + ":" + area, open = !folded[key];
      html += '<tbody><tr class="us-table-group"><th colspan="4" scope="colgroup"><button class="us-table-toggle" data-key="' + key + '" aria-expanded="' + open + '">' +
        '<i data-lucide="chevron-down" aria-hidden="true"></i><span>' + area + '</span><span class="us-table-count">' + inArea.length + '</span></button></th></tr>';
      inArea.forEach(function (p) {
        html += '<tr><td><span class="project-name">' + esc(p.name) + '</span><span class="project-status">' + esc(p.status) + '</span>' +
          '<span class="project-phone">' + stageTag(p.stage) + '<span>' + shortAge(p.days) + '</span></span></td>' +
          '<td class="stage">' + stageTag(p.stage) + '</td>' +
          '<td class="touched" title="Last touched ' + longAge(p.days) + '">' + shortAge(p.days) + '</td>' +
          '<td><button class="us-btn us-btn-sm" data-copy="' + p.id + '" aria-label="Copy a prompt for a new session on ' + esc(p.name) + '"><i data-lucide="copy" aria-hidden="true"></i><span>Copy prompt</span></button></td></tr>';
      });
      html += '</tbody>';
    });
    html += '</table></div></section>';
  });
  if (visible.length) html += renderWork(visible);
  if (!html) html = '<section class="us-panel"><div class="desk-empty"><p>No projects match these filters.</p><button class="us-btn" id="clear"><i data-lucide="x" aria-hidden="true"></i><span>Clear filters</span></button></div></section>';
  document.getElementById("panels").innerHTML = html;
  watchWork();
}

// The tasks table: one row per project that opens to show its tasks in the same columns.
// Sort, column widths and which rows are open are remembered per browser.
var WORK = DATA.work;
var TASK = { todo: ["To do", ""], doing: ["In progress", "is-muted"], done: ["Done", "is-success"], blocked: ["Blocked", "is-danger"] };
var COLS = [
  { id: "name", label: "Project", sort: function (p) { return p.name.toLowerCase(); } },
  { id: "lead", label: "Lead", width: 180, sort: function (p) { return WORK[p.id].lead ? WORK[p.id].lead.toLowerCase() : "\uffff"; } },
  { id: "status", label: "Status", width: 180, sort: function (p) { return statusOf(p)[2]; } },
  { id: "progress", label: "Progress", width: 224, sort: function (p) { var t = WORK[p.id].tasks; return doneIn(t) / t.length; } },
  { id: "when", label: "Updated", width: 112, sort: function (p) { return p.days; } }
];
function store(k, v) { try { localStorage.setItem("understudy-" + k, JSON.stringify(v)); } catch (e) {} }
function load(k, fallback) { try { var v = JSON.parse(localStorage.getItem("understudy-" + k)); return v == null ? fallback : v; } catch (e) { return fallback; } }
var sortBy = load("work-sort", { col: "when", dir: "ascending" });
var openRows = load("work-open", {});
var widths = load("work-widths", null);

function statusOf(p) {
  if (p.attention) return ["Needs attention", "is-danger", 0];
  if (p.stage === "Paused") return ["Paused", "is-muted", 3];
  if (p.stage === "Shipped") return ["Shipped", "is-success", 4];
  return [p.stage, "", p.stage === "Idea" ? 2 : 1];
}
function doneIn(tasks) { return tasks.filter(function (t) { return t[2] === "done"; }).length; }
function initials(name) { return name.split(" ").map(function (w) { return w[0]; }).join("").slice(0, 2); }
function person(name, none) {
  return name ? '<span class="us-person"><span class="us-avatar" aria-hidden="true">' + initials(name) + '</span>' + esc(name) + '</span>'
    : '<span class="us-person is-unassigned"><span class="us-avatar is-none" aria-hidden="true"><i data-lucide="user"></i></span>' + none + '</span>';
}
function status(word, dot) { return '<span class="us-status"><span class="us-dot ' + dot + '"></span>' + word + '</span>'; }

function renderWork(rows) {
  var col = COLS.find(function (c) { return c.id === sortBy.col; }), sign = sortBy.dir === "ascending" ? 1 : -1;
  rows = rows.slice().sort(function (a, b) { var x = col.sort(a), y = col.sort(b); return (x < y ? -1 : x > y ? 1 : 0) * sign || a.name.localeCompare(b.name); });
  var allOpen = rows.every(function (p) { return openRows[p.id]; });
  var html = '<section class="us-panel" aria-labelledby="h-work"><div class="us-panel-head"><h2 class="us-display" id="h-work">Tasks</h2>' +
    '<button class="us-btn us-btn-sm" id="expand-all" data-open="' + !allOpen + '"><i data-lucide="' + (allOpen ? "chevrons-down-up" : "chevrons-up-down") + '" aria-hidden="true"></i><span>' + (allOpen ? "Collapse all" : "Expand all") + '</span></button></div>' +
    '<div class="us-table-wrap is-resizable"><table class="us-table is-fixed work-table" id="work"><colgroup>' +
    COLS.map(function (c) { return '<col data-col="' + c.id + '">'; }).join("") + '</colgroup><thead><tr>' +
    COLS.map(function (c, i) {
      var on = c.id === sortBy.col;
      return '<th scope="col"' + (on ? ' aria-sort="' + sortBy.dir + '"' : '') + '><button class="us-th-sort" data-sort="' + c.id + '">' + c.label +
        (on ? '<i data-lucide="' + (sortBy.dir === "ascending" ? "arrow-up" : "arrow-down") + '" aria-hidden="true"></i>' : '') + '</button>' +
        (i < COLS.length - 1 ? '<div class="us-drag" data-col="' + c.id + '" tabindex="0" role="separator" aria-orientation="vertical" aria-label="Resize the ' + c.label.toLowerCase() + ' column"></div>' : '') + '</th>';
    }).join("") + '</tr></thead><tbody>';
  rows.forEach(function (p) {
    var w = WORK[p.id], open = !!openRows[p.id], st = statusOf(p), done = doneIn(w.tasks);
    html += '<tr><td><button class="us-row-toggle" data-open-row="' + p.id + '" aria-expanded="' + open + '"><i data-lucide="chevron-down" aria-hidden="true"></i><span>' + esc(p.name) + '</span></button></td>' +
      '<td>' + person(w.lead, "No lead") + '</td><td>' + status(st[0], st[1]) + '</td>' +
      '<td><div class="us-progress-cell"><div class="us-progress" role="progressbar" aria-label="Tasks done" aria-valuenow="' + done + '" aria-valuemax="' + w.tasks.length + '"><span class="is-success" style="width:' + (done / w.tasks.length * 100) + '%"></span></div>' +
      '<span class="us-meta">' + done + ' of ' + w.tasks.length + ' done</span></div></td>' +
      '<td class="when" title="Updated ' + longAge(p.days) + '">' + shortAge(p.days) + '</td></tr>';
    if (open) w.tasks.forEach(function (t) {
      html += '<tr class="us-table-child"><td class="is-wrap">' + esc(t[0]) + '</td><td>' + person(t[1], "Unassigned") + '</td><td>' + status(TASK[t[2]][0], TASK[t[2]][1]) + '</td><td></td><td></td></tr>';
    });
  });
  return html + '</tbody></table></div></section>';
}

// Column widths. Until the reader drags, Project takes the room the fixed columns leave. Once they drag, every column but the last
// keeps a width and the last takes what is left; past the panel's width the table scrolls sideways.
function applyWidths() {
  var table = document.getElementById("work"); if (!table) return;
  var sum = 0;
  COLS.forEach(function (c, i) {
    var w = widths ? (i < COLS.length - 1 ? widths[c.id] : null) : c.width;
    table.querySelector('col[data-col="' + c.id + '"]').style.width = w ? w + "px" : "";
    if (widths && w) sum += w;
  });
  table.style.minWidth = widths ? (sum + 96) + "px" : "";
}
function freezeWidths() {
  if (widths) return;
  widths = {};
  document.querySelectorAll("#work thead th").forEach(function (th, i) { if (i < COLS.length - 1) widths[COLS[i].id] = Math.round(th.getBoundingClientRect().width); });
}
function resize(col, w) { widths[col] = Math.round(Math.min(640, Math.max(80, w))); applyWidths(); store("work-widths", widths); }

// The drag strips run the table's full height, so the table's height goes in --us-table-h, kept current as rows open and close.
var tableObserver = window.ResizeObserver ? new ResizeObserver(function (entries) {
  entries.forEach(function (e) { e.target.style.setProperty("--us-table-h", e.target.offsetHeight + "px"); });
}) : null;
function watchWork() {
  var table = document.getElementById("work"); if (!table) return;
  applyWidths();
  if (tableObserver) { tableObserver.disconnect(); tableObserver.observe(table); }
  else table.style.setProperty("--us-table-h", table.offsetHeight + "px");
}

var panels = document.getElementById("panels");
panels.addEventListener("pointerdown", function (e) {
  var strip = e.target.closest("#work .us-drag"); if (!strip) return;
  e.preventDefault();
  freezeWidths();
  var col = strip.dataset.col, start = e.clientX, from = widths[col];
  strip.setPointerCapture(e.pointerId); strip.classList.add("is-dragging");
  function move(ev) { resize(col, from + ev.clientX - start); }
  function up() { strip.classList.remove("is-dragging"); strip.removeEventListener("pointermove", move); strip.removeEventListener("pointerup", up); }
  strip.addEventListener("pointermove", move); strip.addEventListener("pointerup", up);
});
panels.addEventListener("keydown", function (e) {
  var strip = e.target.closest("#work .us-drag"); if (!strip || (e.key !== "ArrowLeft" && e.key !== "ArrowRight")) return;
  e.preventDefault(); freezeWidths();
  resize(strip.dataset.col, widths[strip.dataset.col] + (e.key === "ArrowRight" ? 16 : -16));
});
panels.addEventListener("dblclick", function (e) {
  if (!e.target.closest("#work .us-drag")) return;
  widths = null; applyWidths(); try { localStorage.removeItem("understudy-work-widths"); } catch (err) {}
});

function render() { renderControls(); renderNav(); renderPanels(); icons(); }

// Filters
document.getElementById("f-search").addEventListener("input", function (e) { f.query = e.target.value.trim().toLowerCase(); renderPanels(); icons(); });
document.getElementById("f-attention").addEventListener("click", function () { f.attention = !f.attention; render(); });
document.getElementById("f-stage").addEventListener("change", function (e) { f.stage = e.target.value; render(); });
document.getElementById("f-area").addEventListener("change", function (e) { f.area = e.target.value; render(); });
document.getElementById("f-paused").addEventListener("change", function (e) { f.paused = e.target.checked; render(); });
document.querySelector(".us-workspace-nav").addEventListener("click", function (e) {
  var row = e.target.closest(".us-row"); if (!row) return;
  e.preventDefault();
  if (row.dataset.view) { f.area = ""; f.attention = row.dataset.view === "attention"; }
  if (row.dataset.area) f.area = row.dataset.area;
  render();
});

// Folding groups: the button's aria-expanded is the state; the stylesheet hides the rest of its tbody.
document.getElementById("panels").addEventListener("click", function (e) {
  var sort = e.target.closest("[data-sort]");
  if (sort) {
    var id = sort.dataset.sort;
    sortBy = { col: id, dir: sortBy.col === id && sortBy.dir === "ascending" ? "descending" : "ascending" };
    store("work-sort", sortBy); renderPanels(); icons();
    document.querySelector('[data-sort="' + id + '"]').focus(); return;
  }
  var row = e.target.closest("[data-open-row]");
  if (row) {
    var pid = row.dataset.openRow;
    if (openRows[pid]) delete openRows[pid]; else openRows[pid] = true;
    store("work-open", openRows); renderPanels(); icons();
    document.querySelector('[data-open-row="' + pid + '"]').focus(); return;
  }
  var all = e.target.closest("#expand-all");
  if (all) {
    var opening = all.dataset.open === "true";
    PROJECTS.filter(shown).forEach(function (p) { if (opening) openRows[p.id] = true; else delete openRows[p.id]; });
    store("work-open", openRows); renderPanels(); icons();
    document.getElementById("expand-all").focus(); return;
  }
  var toggle = e.target.closest(".us-table-toggle");
  if (toggle) { var open = toggle.getAttribute("aria-expanded") !== "true"; toggle.setAttribute("aria-expanded", String(open)); folded[toggle.dataset.key] = !open; return; }
  if (e.target.closest("#clear")) { f = Object.assign({}, BLANK); document.getElementById("f-search").value = ""; render(); return; }
  var btn = e.target.closest("[data-copy]"); if (btn) copyPrompt(btn);
});

// Copy prompt: the clipboard API where the page allows it, a hidden textarea where it does not.
function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text).catch(function () { return fallback(text); });
  return fallback(text);
}
function fallback(text) {
  var ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  var ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
  ta.remove();
  return ok ? Promise.resolve() : Promise.reject();
}
function copyPrompt(btn) {
  var p = PROJECTS.find(function (x) { return x.id === btn.dataset.copy; });
  copyText(promptFor(p)).then(function () { flash(btn, "check", "Copied"); }, function () { flash(btn, "x", "Couldn't copy"); });
}
function flash(btn, icon, label) {
  btn.innerHTML = '<i data-lucide="' + icon + '" aria-hidden="true"></i><span>' + label + '</span>';
  icons();
  document.getElementById("announce").textContent = label;
  clearTimeout(btn._t);
  btn._t = setTimeout(function () { btn.innerHTML = '<i data-lucide="copy" aria-hidden="true"></i><span>Copy prompt</span>'; icons(); }, 1600);
}

render();
</script>
</body>
</html>
