<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Offsite links</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>
  .page { max-width: var(--content-width); margin: 0 auto; padding: var(--space-8) max(16px, env(safe-area-inset-right)) var(--space-8) max(16px, env(safe-area-inset-left)); }
  h1 { font: 500 22px/30px var(--font-sans); margin: 0 0 var(--space-3); }
  p { margin: 0 0 var(--space-6); }
  .us-list { margin: 0 calc(-1 * var(--space-2)); }
</style>
</head>
<body>
<main class="page">
  <h1>Everything for the team offsite</h1>
  <p>The plan, the room and the bookings in one place. The agenda changes until Friday, so check it on the day.</p>
  <nav class="us-list" aria-label="Links">
    <a class="us-row" href="#"><i data-lucide="calendar" aria-hidden="true"></i><span>Agenda</span><span class="us-row-meta">Updated today</span></a>
    <a class="us-row" href="#"><i data-lucide="map-pin" aria-hidden="true"></i><span>Venue and directions</span><span class="us-row-meta">Thursday</span></a>
    <a class="us-row" href="#"><i data-lucide="file-text" aria-hidden="true"></i><span>Pre-reads</span><span class="us-row-meta">3 docs</span></a>
    <a class="us-row" href="#"><i data-lucide="utensils" aria-hidden="true"></i><span>Dinner booking</span><span class="us-row-meta">7:30 pm</span></a>
  </nav>
</main>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script>window.lucide?.createIcons({ attrs: { "stroke-width": 1.75 } });</script>
</body>
</html>
