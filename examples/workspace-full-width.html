<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Customer requests</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400&display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>
  .us-workspace-nav { position: sticky; }
  .nav-rules { margin-top: auto; padding: var(--space-2) var(--space-1) 0; border-top: 1px solid var(--border-subtle); }
  .nav-rules p { margin: var(--space-1) 0 0; font-size: 13px; line-height: 18px; color: var(--text-secondary); }
  .nav-rules + .us-nav-foot { margin-top: 0; }   /* the rules take the free space, the footer sits under them */
  .main-col { min-width: 0; position: relative; }
  /* The search stays at the top of the list while it scrolls. */
  .list-search { position: sticky; top: 0; z-index: 1; padding: var(--space-2); background: var(--bg-row); border-bottom: 1px solid var(--border-subtle); }
  .list-search .us-search { display: flex; width: 100%; }
  .issue-none { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3); }
  .list-empty { padding: var(--space-4) var(--space-3); font-size: 14px; color: var(--text-secondary); }
  /* Detail: tags, title, meta line, then label and value rows split by hairlines. */
  .detail-head { display: flex; flex-direction: column; gap: var(--space-3); margin-bottom: var(--space-3); }
  .detail-tags { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .us-record-where span { display: inline-flex; align-items: center; gap: 6px; }
  .us-record-where svg.lucide { width: 14px; height: 14px; }
  .record-rows { margin: 0 0 var(--space-4); }
  .record-row { display: grid; grid-template-columns: 136px minmax(0, 1fr); gap: var(--space-4); padding: var(--space-3) 0; border-top: 1px solid var(--border-subtle); }
  .record-row:last-child { border-bottom: 1px solid var(--border-subtle); }
  .record-row dt { font-size: 14px; line-height: 24px; color: var(--text-secondary); }
  .record-row dd { margin: 0; }
  .same-ask { display: flex; flex-direction: column; gap: 4px; }
  .same-ask a { color: var(--link); text-decoration: none; }
  .same-ask a:hover { text-decoration: underline; }
  .issue-id { font-family: var(--font-mono); font-size: 14px; }
  .detail-note { margin-bottom: var(--space-6); }
  @container (max-width: 520px) { .record-row { grid-template-columns: 1fr; gap: 2px; } }
</style>
</head>
<body>
<div class="us-workspace is-flat" id="ws">
  <nav class="us-workspace-nav" aria-label="Requests">
    <div class="us-nav-top"><span class="us-nav-title">Requests</span>
      <button class="us-nav-toggle" id="nav-hide" aria-label="Hide sidebar" title="Hide sidebar (Cmd or Ctrl and \)" aria-keyshortcuts="Meta+\ Control+\"><i data-lucide="panel-left-close" aria-hidden="true"></i></button></div>
    <div class="us-list-label">Group by</div>
    <a class="us-row" href="#" data-group="need" aria-current="true"><i data-lucide="layers" aria-hidden="true"></i><span>Same ask</span></a>
    <a class="us-row" href="#" data-group="customer"><i data-lucide="building-2" aria-hidden="true"></i><span>Customer</span></a>
    <div class="us-list-label">Show</div>
    <div id="filters"></div>
    <div class="nav-rules">
      <div class="us-meta">How this works</div>
      <p>Requests come from calls, tickets and renewal notes. Ones that ask for the same thing sit together, so a need shows up once with everyone behind it.</p>
    </div>
    <div class="us-nav-foot"><span class="us-meta" id="read-at">Read just now</span>
      <button class="us-icon-btn" id="reread" aria-label="Read again"><i data-lucide="refresh-cw" aria-hidden="true"></i></button></div>
  </nav>
  <div class="us-drag is-nav" data-drag="nav" tabindex="0" role="separator" aria-orientation="vertical" aria-label="Resize sidebar"></div>
  <button class="us-nav-toggle us-nav-expand" id="nav-show" aria-label="Show sidebar" title="Show sidebar (Cmd or Ctrl and \)"><i data-lucide="panel-left-open" aria-hidden="true"></i></button>

  <div class="main-col">
    <div class="us-tracker" id="tracker"></div>
    <div class="us-split" id="split">
      <div class="us-split-col">
        <div class="us-split-list">
          <div class="list-search"><label class="us-search"><i data-lucide="search" aria-hidden="true"></i><input type="search" id="search" placeholder="Search requests or customers" aria-label="Search requests or customers"></label></div>
          <div id="list" role="listbox" aria-label="Requests"></div>
        </div>
        <div class="us-drag" data-drag="list" tabindex="0" role="separator" aria-orientation="vertical" aria-label="Resize list"></div>
      </div>
      <div class="us-split-detail" id="detail"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script>
var DATA = JSON.parse(document.getElementById("data").textContent);
var NEEDS = DATA.needs, REQUESTS = DATA.requests;
var STATUS = {
  new: { label: "Not in tracker", tag: "us-tag-outline", dot: "" },
  tracked: { label: "In tracker", tag: "", dot: "is-warning" },
  shipped: { label: "Shipped", tag: "us-tag-success", dot: "is-success" }
};
var FILTERS = [
  { id: "all", label: "All requests", icon: "list", test: function () { return true; } },
  { id: "new", label: "Not in tracker", icon: "circle-dashed", test: function (r) { return r.status === "new"; } },
  { id: "tracked", label: "In tracker", icon: "circle-dot", test: function (r) { return r.status === "tracked"; } },
  { id: "shipped", label: "Shipped", icon: "circle-check", test: function (r) { return r.status === "shipped"; } },
  { id: "unclear", label: "Unclear who asked", icon: "circle-help", test: function (r) { return !!r.unclear; } }
];
var groupBy = "need", filter = "all", query = "", selected = "r1", collapsed = {};

function esc(s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
function byId(id) { return REQUESTS.find(function (r) { return r.id === id; }); }
function current() { return byId(selected); }
function matches(r) { return !query || (r.title + " " + r.customer + " " + NEEDS[r.need]).toLowerCase().indexOf(query) > -1; }
function visible() { var f = FILTERS.find(function (x) { return x.id === filter; }); return REQUESTS.filter(function (r) { return f.test(r) && matches(r); }); }
function plural(n, word) { return n + " " + word + (n === 1 ? "" : "s"); }
function customersIn(list) { return list.map(function (r) { return r.customer; }).filter(function (c, i, a) { return a.indexOf(c) === i; }); }
function shortAge(d) { return d < 7 ? d + "d" : d < 30 ? Math.floor(d / 7) + "w" : d < 365 ? Math.floor(d / 30) + "mo" : Math.floor(d / 365) + "y"; }
function longAge(d) {
  if (d === 0) return "Asked today";
  var n = d < 7 ? d : d < 30 ? Math.floor(d / 7) : d < 365 ? Math.floor(d / 30) : Math.floor(d / 365);
  return "Asked " + plural(n, d < 7 ? "day" : d < 30 ? "week" : d < 365 ? "month" : "year") + " ago";
}

// Groups in a stable order: needs as listed in the data, customers alphabetically. Rows newest first.
function groups() {
  var rows = visible(), keys;
  if (groupBy === "need") keys = Object.keys(NEEDS);
  else keys = customersIn(REQUESTS).sort();
  return keys.map(function (k) {
    var all = REQUESTS.filter(function (r) { return (groupBy === "need" ? r.need : r.customer) === k; });
    var shown = rows.filter(function (r) { return all.indexOf(r) > -1; }).sort(function (a, b) { return a.days - b.days; });
    var count = groupBy === "need" ? plural(customersIn(all).length, "customer") : plural(all.length, "request");
    return { key: k, name: groupBy === "need" ? NEEDS[k] : k, count: count, rows: shown };
  }).filter(function (g) { return g.rows.length; });
}

function renderTracker() {
  var n = function (s) { return REQUESTS.filter(function (r) { return r.status === s; }).length; };
  document.getElementById("tracker").innerHTML =
    '<span class="us-tracker-name">Customer requests</span>' +
    '<div class="us-progress" role="progressbar" aria-label="Shipped and tracked" aria-valuenow="' + (n("shipped") + n("tracked")) + '" aria-valuemax="' + REQUESTS.length + '">' +
    '<span class="is-success" style="width:' + (n("shipped") / REQUESTS.length * 100) + '%"></span><span class="is-warning" style="width:' + (n("tracked") / REQUESTS.length * 100) + '%"></span></div>' +
    '<span class="us-tracker-count"><strong>' + REQUESTS.length + '</strong> requests from ' + customersIn(REQUESTS).length + ' customers, ' + n("shipped") + ' shipped, ' + n("new") + ' not in the tracker</span>';
}

function renderNav() {
  document.querySelectorAll("[data-group]").forEach(function (r) { r.setAttribute("aria-current", String(r.dataset.group === groupBy)); });
  document.getElementById("filters").innerHTML = FILTERS.map(function (f) {
    return '<a class="us-row" href="#" data-filter="' + f.id + '" aria-current="' + (f.id === filter) + '"><i data-lucide="' + f.icon + '" aria-hidden="true"></i><span>' + esc(f.label) + '</span><span class="us-row-count">' + REQUESTS.filter(f.test).length + '</span></a>';
  }).join("");
}

function renderList() {
  var html = "";
  groups().forEach(function (g) {
    var open = !collapsed[groupBy + ":" + g.key];
    html += '<button class="us-split-group is-toggle" data-key="' + esc(g.key) + '" aria-expanded="' + open + '"><i data-lucide="chevron-down" aria-hidden="true"></i><span>' + esc(g.name) + '</span><span class="us-split-count">' + g.count + '</span></button>';
    if (!open) return;
    g.rows.forEach(function (r) {
      var sub = groupBy === "need" ? r.customer : NEEDS[r.need];
      html += '<div class="us-split-row" role="option" tabindex="0" data-id="' + r.id + '" aria-selected="' + (r.id === selected) + '"><span class="us-dot ' + STATUS[r.status].dot + '"></span>' +
        '<span class="us-split-name">' + esc(r.title) + '<span class="us-split-sub">' + esc(sub) + '</span></span><span class="us-split-when" title="' + longAge(r.days) + '">' + shortAge(r.days) + '</span></div>';
    });
  });
  document.getElementById("list").innerHTML = html || '<div class="list-empty">' + (query ? "No requests match that search." : "No requests match this filter.") + '</div>';
}

function renderDetail() {
  var r = current();
  var s = STATUS[r.status];
  var tags = '<span class="us-tag ' + s.tag + '">' + s.label + '</span>' + (r.unclear ? '<span class="us-tag us-tag-outline">Unclear who asked</span>' : '');
  var others = REQUESTS.filter(function (o) { return o.need === r.need && o.id !== r.id; });
  var same = '<div class="same-ask"><span>' + esc(NEEDS[r.need]) + '</span>' + others.map(function (o) {
    return '<a href="#" data-goto="' + o.id + '">' + esc(o.customer) + ': ' + esc(o.title) + '</a>';
  }).join("") + '</div>';
  var row = function (label, value) { return '<div class="record-row"><dt>' + label + '</dt><dd>' + value + '</dd></div>'; };
  document.getElementById("detail").innerHTML = '<div class="us-split-page">' +
    '<div class="detail-head"><div class="detail-tags">' + tags + '</div><h2 class="us-record-title">' + esc(r.title) + '</h2>' +
    '<div class="us-record-where"><span><i data-lucide="building-2" aria-hidden="true"></i>' + esc(r.customer) + '</span>' +
    '<span><i data-lucide="calendar" aria-hidden="true"></i>' + longAge(r.days) + '</span>' +
    '<span><i data-lucide="user" aria-hidden="true"></i>' + esc(r.contact) + '</span></div></div>' +
    '<dl class="record-rows">' +
    row("Why", esc(r.why)) +
    row("Committed", esc(r.committed)) +
    row("Same ask", same) +
    row("Issue", r.issue ? '<span class="issue-id">' + esc(r.issue) + '</span>' :
      '<div class="issue-none"><span>No issue yet</span><button class="us-btn us-btn-sm" data-track="' + r.id + '"><i data-lucide="plus" aria-hidden="true"></i><span>Add to tracker</span></button></div>') +
    '</dl>' +
    (r.note ? '<div class="us-quote detail-note">' + esc(r.note) + '</div>' : '') + '</div>';
}

function render() {
  renderTracker(); renderNav(); renderList(); renderDetail();
  window.lucide?.createIcons({ attrs: { "stroke-width": 1.75 } });
}

// The list sticks under the tracker, so the split needs the tracker's height. The tracker wraps when the pane
// narrows, so watch it rather than measuring once; a stale height leaves the list too low and the page scrolls.
var tracker = document.getElementById("tracker"), split = document.getElementById("split");
function setBarHeight() { split.style.setProperty("--us-bar-h", tracker.offsetHeight + "px"); }
if (window.ResizeObserver) new ResizeObserver(setBarHeight).observe(tracker);
else window.addEventListener("resize", setBarHeight);

// Keep the selection on a request the list shows; fall back to the first one.
function keepSelection() {
  var rows = visible();
  if (!rows.some(function (r) { return r.id === selected; })) { var g = groups()[0]; if (g) selected = g.rows[0].id; }
}
function select(id) {
  var r = byId(id);
  if (!visible().some(function (v) { return v.id === id; })) { filter = "all"; query = ""; document.getElementById("search").value = ""; }
  delete collapsed[groupBy + ":" + (groupBy === "need" ? r.need : r.customer)];
  selected = id; render();
  var el = document.querySelector('.us-split-row[data-id="' + id + '"]');
  if (el) el.scrollIntoView({ block: "nearest" });
}

document.querySelector(".us-workspace-nav").addEventListener("click", function (e) {
  var row = e.target.closest(".us-row"); if (!row) return;
  e.preventDefault();
  if (row.dataset.group) groupBy = row.dataset.group;
  if (row.dataset.filter) filter = row.dataset.filter;
  keepSelection(); render();
});
function toggle(heading) {
  var k = groupBy + ":" + heading.dataset.key;
  collapsed[k] = !collapsed[k]; renderList();
  window.lucide?.createIcons({ attrs: { "stroke-width": 1.75 } });
  var again = document.querySelector('.us-split-group[data-key="' + CSS.escape(heading.dataset.key) + '"]'); if (again) again.focus();
}
document.getElementById("list").addEventListener("click", function (e) {
  var heading = e.target.closest(".us-split-group.is-toggle"); if (heading) { toggle(heading); return; }
  var row = e.target.closest(".us-split-row"); if (!row) return;
  selected = row.dataset.id; render();
});
document.getElementById("list").addEventListener("keydown", function (e) {
  if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
  e.preventDefault();
  var ids = Array.prototype.map.call(document.querySelectorAll(".us-split-row"), function (r) { return r.dataset.id; });
  if (!ids.length) return;
  var at = ids.indexOf(selected);
  selected = ids[Math.min(ids.length - 1, Math.max(0, at + (e.key === "ArrowDown" ? 1 : -1)))]; render();
  document.querySelector('.us-split-row[data-id="' + selected + '"]').focus();
});
document.getElementById("detail").addEventListener("click", function (e) {
  var track = e.target.closest("[data-track]");
  if (track) {
    // Adding to the tracker files an issue: take the next number after the highest one so far.
    var next = Math.max.apply(null, REQUESTS.filter(function (r) { return r.issue; }).map(function (r) { return +r.issue.split("-")[1]; })) + 1;
    var r = byId(track.dataset.track); r.status = "tracked"; r.issue = "PLT-" + next;
    keepSelection(); render(); return;
  }
  var link = e.target.closest("[data-goto]"); if (!link) return;
  e.preventDefault(); select(link.dataset.goto);
});
document.getElementById("search").addEventListener("input", function (e) {
  query = e.target.value.trim().toLowerCase(); keepSelection(); render();
});

// Drag strips: resize the nav (180 to 420px) and the list (220 to 560px). Arrow keys move a focused strip 16px. Double-click resets.
var LIMITS = { nav: [180, 420, "--us-nav-w", "ws"], list: [220, 560, "--list-width", "split"] };
function store(k, v) { try { localStorage.setItem("understudy-" + k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem("understudy-" + k); } catch (e) { return null; } }
Object.keys(LIMITS).forEach(function (k) {
  var l = LIMITS[k], saved = load(k);
  if (saved) document.getElementById(l[3]).style.setProperty(l[2], saved + "px");
});
document.querySelectorAll(".us-drag").forEach(function (strip) {
  var l = LIMITS[strip.dataset.drag], host = document.getElementById(l[3]);
  strip.addEventListener("pointerdown", function (e) {
    var start = e.clientX, from = (strip.dataset.drag === "nav" ? document.querySelector(".us-workspace-nav") : strip.parentElement).getBoundingClientRect().width;
    strip.setPointerCapture(e.pointerId); strip.classList.add("is-dragging");
    function move(ev) {
      var w = Math.round(Math.min(l[1], Math.max(l[0], from + ev.clientX - start)));
      host.style.setProperty(l[2], w + "px"); store(strip.dataset.drag, w);
    }
    function up() { strip.classList.remove("is-dragging"); strip.removeEventListener("pointermove", move); strip.removeEventListener("pointerup", up); }
    strip.addEventListener("pointermove", move); strip.addEventListener("pointerup", up);
  });
  strip.addEventListener("keydown", function (e) {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    e.preventDefault();
    var from = (strip.dataset.drag === "nav" ? document.querySelector(".us-workspace-nav") : strip.parentElement).getBoundingClientRect().width;
    var w = Math.round(Math.min(l[1], Math.max(l[0], from + (e.key === "ArrowRight" ? 16 : -16))));
    host.style.setProperty(l[2], w + "px"); store(strip.dataset.drag, w);
  });
  strip.addEventListener("dblclick", function () { host.style.removeProperty(l[2]); try { localStorage.removeItem("understudy-" + strip.dataset.drag); } catch (e) {} });
});

// Hide the nav from its button or Cmd or Ctrl and backslash; bring it back from the button at the top left. Remembered per browser.
var ws = document.getElementById("ws");
function setNav(hidden, focus) {
  ws.classList.toggle("is-nav-hidden", hidden);
  store("nav-hidden", hidden ? "1" : "");
  if (focus) document.getElementById(hidden ? "nav-show" : "nav-hide").focus();
}
setNav(load("nav-hidden") === "1");
document.getElementById("nav-hide").addEventListener("click", function () { setNav(true, true); });
document.getElementById("nav-show").addEventListener("click", function () { setNav(false, true); });
document.addEventListener("keydown", function (e) {
  if (e.key === "\\" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); setNav(!ws.classList.contains("is-nav-hidden")); }
});

// The footer says when the requests were last read. Reading again here only resets the clock.
var readAt = Date.now();
function renderReadAt() {
  var m = Math.floor((Date.now() - readAt) / 60000);
  document.getElementById("read-at").textContent = m < 1 ? "Read just now" : "Read " + plural(m, "minute") + " ago";
}
document.getElementById("reread").addEventListener("click", function () { readAt = Date.now(); renderReadAt(); });
setInterval(renderReadAt, 30000);

render();
</script>
</body>
</html>
